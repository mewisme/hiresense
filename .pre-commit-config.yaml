# https://pre-commit.com
# Windows: `pipx install pre-commit` then `pnpm precommit:install`.

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: false

exclude: '(?x)^(pnpm-lock\.yaml|uv\.lock|apps/api/\.agents/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        files: ^apps/ai/
        args: [--fix]
      - id: ruff-format
        files: ^apps/ai/

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, css, scss, less, html, json, markdown, yaml]
